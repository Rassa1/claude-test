<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printable QR Codes</title>
<script src="/qrcode.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
  .note { max-width: 700px; } @media print { .note { display: none; } }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .sign { border: 2px solid #111; border-radius: 16px; padding: 20px; text-align: center; break-inside: avoid; }
  .sign h2 { margin: 0 0 4px; font-size: 26px; } .sign p { margin: 6px 0; }
  .sign svg { width: 220px; height: 220px; } .url { font-size: 12px; color: #555; word-break: break-all; }
</style>
</head>
<body>
<div class="note"><h1>QR signs</h1><p>Print this page (Ctrl/Cmd + P). Each code only works for its own place: post each stop’s sign at that stop, and each shuttle’s sign inside that shuttle. Open this page from your <b>live</b> site so the codes point to it. If you set <code>QR_SECRET</code>, open it as <code>/qr?key=ADMIN_KEY</code>.</p></div>
<div class="sheet" id="sheet"></div>
<script>
(async () => {
  const res = await fetch('/api/qr-links' + location.search);
  if (!res.ok) { document.getElementById('sheet').textContent = (await res.json()).error; return; }
  const links = await res.json();
  const qr = url => { const q = qrcode(0, 'M'); q.addData(url); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); };
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const card = (title, sub, url) => `<div class="sign"><h2>${esc(title)}</h2><p>${sub}</p>${qr(url)}<div class="url">${esc(url.replace(/\?k=.*/, ''))}</div></div>`;
  const base = location.origin;
  document.getElementById('sheet').innerHTML = links.map(l => l.kind === 'stop'
    ? card(l.name, 'Shuttle stop. Scan to see when the next shuttle comes,<br>and tap when it pulls in.', base + l.path)
    : card(l.name, 'Riding? Scan and tap the stop we’re at.<br>It helps everyone waiting.', base + l.path)).join('');
})();
</script>
</body>
</html>
